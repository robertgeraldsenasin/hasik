# Weekly dependency updates, grouped so they arrive as a few PRs instead of dozens.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: '09:00', timezone: Asia/Manila }
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
      runtime:
        dependency-type: production
    commit-message: { prefix: 'chore(deps)' }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: '09:00', timezone: Asia/Manila }
    groups:
      actions:
        patterns: ['*']
    commit-message: { prefix: 'ci(deps)' }
