# DRAFT - nightly round-robin tournament and leaderboard refresh.
name: nightly
on:
  schedule:
    - cron: '0 18 * * *'   # 02:00 Asia/Manila
  workflow_dispatch:

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: pnpm arena:roundrobin --pairs 100 --nodes 20000 --out results/nightly.jsonl
      - run: pnpm ratings:update --in results/nightly.jsonl --out apps/web/public/leaderboard.json
      - run: pnpm readme:tables
      - name: Commit leaderboard
        run: |
          git config user.name "sungka-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/public/leaderboard.json results/ README.md
          git commit -m "chore: nightly leaderboard" || echo "no changes"
          git push
